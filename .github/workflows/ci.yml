name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # The app refuses to start without its settings, so the build gets harmless placeholders.
    # No real secret is used or needed here.
    env:
      HOSTINGER_MAIL_TOKEN: ci-placeholder
      HOSTINGER_WEBHOOK_SECRET: ci-placeholder
      HOSTINGER_MAILBOX_MAP: "{}"
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      AUTH_GITHUB_ID: ci-placeholder
      AUTH_GITHUB_SECRET: ci-placeholder
      AUTH_SECRET: ci-placeholder
      ADMIN_GITHUB_LOGIN: ci-placeholder
      GOOGLE_GENERATIVE_AI_API_KEY: ci-placeholder
      ADMIN_NOTIFICATION_EMAIL: admin@example.com
      NEWSLETTER_CONFIRM_SECRET: ci-placeholder
      CRON_SECRET: ci-placeholder
      RESEND_API_KEY: ci-placeholder
      RESEND_AUDIENCE_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint, type-check, test and build
        run: npm run verify
